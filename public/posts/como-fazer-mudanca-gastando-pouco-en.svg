<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#1a0f1a"/>
      <stop offset="100%" stop-color="#0f0f15"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A7B9"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#F67C6F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.08">
    <rect x="60" y="60" width="240" height="240" rx="50" fill="url(#rose)" transform="rotate(-15 180 180)"/>
    <rect x="880" y="320" width="220" height="220" rx="40" fill="url(#accent)" transform="rotate(10 990 430)"/>
  </g>

  <g transform="translate(600, 220)" text-anchor="middle">
    <text x="0" y="20" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#F4A7B9" letter-spacing="8" opacity="0.9">
      ATACADINHO DA RAFA
    </text>
    <text x="0" y="75" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="1">
      How to Move
    </text>
    <text x="0" y="130" font-family="Georgia, serif" font-size="44" font-weight="700" fill="url(#rose)" letter-spacing="1">
      on a Budget: Step by Step
    </text>
    <text x="0" y="180" font-family="sans-serif" font-size="16" font-weight="300" fill="#9ca3af" letter-spacing="1">
      Plan every stage and love the result
    </text>
  </g>

  <g transform="translate(600, 380)" text-anchor="middle">
    <rect x="-120" y="-15" width="240" height="30" rx="15" fill="url(#rose)" opacity="0.15"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#F4A7B9" letter-spacing="3">
      MOVING - HOUSE - BUDGET
    </text>
  </g>

  <g transform="translate(600, 500)" text-anchor="middle">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#6b7280" letter-spacing="1">
      Planning - Packing - Practical tips
    </text>
    <text x="0" y="25" font-family="sans-serif" font-size="11" fill="#4b5563" letter-spacing="0.5">
      Home . Moving . Organization . 2026
    </text>
  </g>

  <g opacity="0.04">
    <line x1="0" y1="580" x2="1200" y2="580" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="620" x2="1200" y2="620" stroke="#ffffff" stroke-width="0.5"/>
  </g>
</svg>